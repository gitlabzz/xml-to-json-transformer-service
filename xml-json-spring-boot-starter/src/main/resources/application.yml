audit:
  history-size: 100
  page-size: 20
  compress: true
  backend: memory
  file-path: audit-store.ser

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db,ping
        liveness:
          include: ping

server:
  tomcat:
    mbeanregistry:
      enabled: true
